spring:
  application:
    name: report-management
  config:
    import: "optional:configserver:http://localhost:8088"
management:
  tracing:
    sampling:
      probability: 1.0
server:
  port: 8085

eureka:
  instance:
    prefer-ip-address: true
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

